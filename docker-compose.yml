services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartdoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartdoc_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-smartdoc}
    ports:
      - "5432:5432"
    volumes:
      - smartdoc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartdoc} -d ${POSTGRES_DB:-smartdoc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartdoc-net

  minio:
    image: minio/minio:latest
    container_name: smartdoc-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartdoc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartdoc_dev_password}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - smartdoc-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartdoc-net

  ai-service:
    build:
      context: ./ai-service-python
      dockerfile: Dockerfile
    container_name: smartdoc-ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_PORT: ${AI_SERVICE_PORT:-8000}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      # Ollama runs on the physical host (not this VM, not a container) — see ADR 0011.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://192.168.56.1:11434/v1}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    networks:
      - smartdoc-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  smartdoc-net:
    driver: bridge

volumes:
  smartdoc-postgres-data:
  smartdoc-minio-data:
