services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartdoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartdoc_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-smartdoc}
    ports:
      - "5432:5432"
    volumes:
      - smartdoc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartdoc} -d ${POSTGRES_DB:-smartdoc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartdoc-net

  minio:
    image: minio/minio:latest
    container_name: smartdoc-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartdoc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartdoc_dev_password}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - smartdoc-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartdoc-net

  # AI Service (Python/FastAPI) — placeholder para Fase 3 (AI pipeline).
  # Se deja declarado desde ahora para no tener que rehacer este compose más
  # adelante, pero no se levanta hasta que exista código en ai-service-python/.
  # ai-service:
  #   build:
  #     context: ./ai-service-python
  #     dockerfile: Dockerfile
  #   container_name: smartdoc-ai-service
  #   restart: unless-stopped
  #   environment:
  #     AI_SERVICE_PORT: ${AI_SERVICE_PORT:-8000}
  #   ports:
  #     - "${AI_SERVICE_PORT:-8000}:8000"
  #   networks:
  #     - smartdoc-net
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

networks:
  smartdoc-net:
    driver: bridge

volumes:
  smartdoc-postgres-data:
  smartdoc-minio-data:
